services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: neonix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # LiveKit dev mode — embedded TURN, single API key, no Redis required.
  # No coturn locally: STUN is enough on a developer machine.
  livekit:
    image: livekit/livekit-server:latest
    command: --dev
    ports:
      - "7880:7880"   # WS signaling
      - "7881:7881"   # TCP fallback
      - "7882:7882/udp" # default RTC port in dev mode

  backend:
    build:
      context: ./backend
    environment:
      PORT: "4000"
      CORS_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
      JWT_SECRET: "dev_secret_change_me"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/neonix?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@postgres:5432/neonix?schema=public"
      LIVEKIT_API_KEY: "devkey"
      LIVEKIT_API_SECRET: "secret"
      LIVEKIT_URL: "ws://localhost:7880"
      LIVEKIT_HTTP_URL: "http://livekit:7880"
    depends_on:
      - postgres
      - redis
      - livekit
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      NEXT_PUBLIC_WS_URL: "http://localhost:4000"
      NEXT_PUBLIC_LIVEKIT_URL: "ws://localhost:7880"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
