# coturn TURN/STUN server config — production VPS deployment
# Documentation: https://github.com/coturn/coturn/wiki/turnserver

# Standard ports
listening-port=3478
tls-listening-port=5349

# Relay port range — must be opened on the VPS firewall as UDP.
min-port=49160
max-port=49200

# Public IP advertised to clients. Replace with the VPS public IP at deploy time
# or set via env-var TURN_EXTERNAL_IP and `envsubst` (see docker-compose.prod.yml).
external-ip=__TURN_EXTERNAL_IP__

# Long-term credential mechanism — we provision a single shared user pair via env.
lt-cred-mech
realm=neonix.app
user=__TURN_USERNAME__:__TURN_PASSWORD__

# TLS — bind-mount Let's Encrypt certificates from the host. The post-renewal
# hook in scripts/coturn-renew-hook.sh restarts coturn so it picks up new keys.
cert=/etc/letsencrypt/live/turn.neonix.app/fullchain.pem
pkey=/etc/letsencrypt/live/turn.neonix.app/privkey.pem

# Hardening
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
fingerprint
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
allowed-peer-ip=__VPS_PUBLIC_IP__

# Logging
log-file=stdout
verbose
