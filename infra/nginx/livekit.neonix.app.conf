# Nginx site for LiveKit signaling (WebSocket) — production VPS.
#
# Media (UDP / 50000-50100) does NOT pass through this proxy — those ports
# must be opened directly on the VPS firewall and NAT'd to the LiveKit container.

server {
    listen 80;
    server_name livekit.neonix.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name livekit.neonix.app;

    ssl_certificate     /etc/letsencrypt/live/livekit.neonix.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.neonix.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # WebSocket signaling
    location / {
        proxy_pass         http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Optional health endpoint
    location = /healthz {
        proxy_pass         http://127.0.0.1:7880/;
        access_log         off;
    }
}
